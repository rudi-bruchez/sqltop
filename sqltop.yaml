instances: []
tiers:
    requests: 1s
    counters: 1s
    space: 5s
    cpuHistory: 1m0s
    livePlan: 2s
retention: 15m0s
server:
    port: 8420
budget:
    serverCpuMsPerSecond: 50
    maxSamples: 500000
layouts:
    default:
        dashboard:
            - group: cpu
              folded: false
              figures:
                current_tasks: true
                other_cpu_percent: true
                runnable_tasks: true
                scheduler_load_factor: true
                schedulers_online: true
                sql_cpu_percent: true
            - group: memory
              folded: false
              figures:
                buffer_cache_hit_ratio: true
                buffer_pool_mb: true
                memory_grants_outstanding: true
                memory_grants_pending: true
                page_life_expectancy: true
                plan_cache_mb: true
                query_memory_mb: true
                target_server_memory_kb: true
                total_server_memory_kb: true
            - group: throughput
              folded: false
              figures:
                active_requests: true
                batch_requests_sec: true
                compilations_sec: true
                full_scans_sec: true
                lazy_writes_sec: true
                page_reads_sec: true
                page_writes_sec: true
                recompilations_sec: true
            - group: tempdb
              folded: false
              figures:
                longest_transaction_s: true
                open_transactions: true
                tempdb_free_mb: true
                tempdb_internal_objects_mb: true
                tempdb_used_mb: true
                tempdb_user_objects_mb: true
                tempdb_version_store_mb: true
                version_store_growth_mb_s: true
                version_store_mb: true
