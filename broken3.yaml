instances:
  - name: test
    dsn: "dsn"
    dsn: "dsn2"
    unknown_key: true
tiers:
  requests: -1s
  counters: 0s
  space: 100000h
  cpuHistory: 1m
  livePlan: 2s
retention: -5m
server:
  port: -1
budget:
  serverCpuMsPerSecond: -50
  maxSamples: -100
unknown_root_key: 42
layouts:
  default:
    dashboard:
      - group: cpu
        folded: false
        figures:
          unknown_figure: true
    views:
      requests:
        columns:
          - field: unknown_col
            show: true
            width: -50
