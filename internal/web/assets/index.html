<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sqltop</title>
<!-- An inline icon, so the browser never asks for /favicon.ico. Without it
     every page load put two "401 Unauthorized" lines in the console: the
     favicon request carries no token, and every route on this server
     requires one by design. Answering it outside the authentication wrapper
     would have been the wrong fix, since a single unauthenticated route is
     exactly what TestEveryRouteRequiresTheToken exists to prevent. Not
     asking is better than answering. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2314161a'/%3E%3Crect x='3' y='9' width='2' height='4' fill='%236fb3d2'/%3E%3Crect x='7' y='5' width='2' height='8' fill='%238fbf7f'/%3E%3Crect x='11' y='7' width='2' height='6' fill='%23d08770'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>sqltop</h1>
  <div class="conn">
    <span id="dot" class="dot" aria-hidden="true"></span>
    <span id="connState" role="status" aria-live="polite">disconnected</span>
    <span id="instance">connecting...</span>
  </div>
  <div id="build" class="build"></div>
</header>

<!-- The instance identity of spec section 6's first row: read once at
     connection and shown above everything else, because every other number
     on this page is meaningless without knowing which server produced it.
     Each item is hidden until it has a value rather than showing an empty
     label, so a source that cannot answer one of them leaves no gap. -->
<dl id="serverInfo" class="serverInfo">
  <div class="si" id="siHost" hidden><dt>host</dt><dd id="infoHost"></dd></div>
  <div class="si" id="siEdition" hidden><dt>edition</dt><dd id="infoEdition"></dd></div>
  <div class="si" id="siVersion" hidden><dt>version</dt><dd id="infoVersion"></dd></div>
  <div class="si" id="siDeployment" hidden><dt>deployment</dt><dd id="infoDeployment"></dd></div>
  <div class="si" id="siUptime" hidden><dt>uptime</dt><dd id="infoUptime"></dd></div>
  <div class="si"><dt>active requests</dt><dd id="infoRequests">0</dd></div>
</dl>

<p id="message" class="message" role="status" aria-live="polite"></p>

<details id="dashboard" class="dashboard" open>
  <summary>server<span id="dashSpan" class="dashSpan"></span></summary>
  <div id="dashBody" class="dashBody"></div>
</details>

<nav id="tabs" class="tabs" aria-label="views and commands"></nav>

<div class="gridScroll">
  <table id="grid" aria-describedby="rowCount">
    <caption class="visually-hidden">Active requests on the connected instance</caption>
    <thead>
      <tr id="gridHead"><th scope="col">spid</th></tr>
      <tr id="gridFilter"></tr>
    </thead>
    <tbody id="gridBody"></tbody>
  </table>
</div>

<!-- The statement of the selected row, toggled with t. Below the grid
     rather than beside it because SQL is tall and narrow lines make it
     unreadable, and outside .gridScroll so the grid gives up height for it
     rather than scrolling it out of sight. -->
<section id="detail" class="detail" hidden aria-labelledby="detailWho">
  <h2 id="detailWho" class="detailWho"></h2>
  <pre id="sqlText" class="sql" tabindex="0"></pre>
</section>

<!-- The three views that are not projections of the retention window. Each
     is filled on demand while its tab is open and left alone otherwise, so
     the queries behind them, one of which walks the whole lock manager, run
     only while somebody is reading the answer. -->
<div class="listScroll" id="panel-sessions" hidden></div>
<div class="listScroll" id="panel-transactions" hidden></div>
<div class="listScroll" id="panel-logs" hidden></div>

<footer id="statusBar">
  <span id="rowCount">0 requests</span>
  <span id="seq"></span>
  <span id="cost"></span>
  <span id="notice" class="notice" role="status" aria-live="polite"></span>
  <span id="rate"></span>
  <span id="pauseMark" class="pauseMark" hidden>paused</span>
  <button type="button" id="colsBtn" class="barBtn">columns</button>
  <button type="button" id="helpBtn" class="barBtn">?</button>
</footer>

<dialog id="helpDialog" class="panel">
  <form method="dialog">
    <h2>views</h2>
    <dl id="helpViews" class="helpList"></dl>
    <h2>commands</h2>
    <dl id="helpList" class="helpList"></dl>
    <menu><button value="close">close</button></menu>
  </form>
</dialog>

<!-- Visibility only. The order is changed by dragging a heading, which is
     the gesture people try first, and a list that reshuffled itself under
     the pointer while boxes were being ticked would be worse than one that
     does not follow. -->
<dialog id="colDialog" class="panel">
  <form method="dialog">
    <h2>columns of <span id="colWhich"></span></h2>
    <div id="colList" class="colList"></div>
    <menu>
      <button type="button" id="colSave">save to sqltop.yaml</button>
      <button value="close">close</button>
    </menu>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
